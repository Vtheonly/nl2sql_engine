[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-engine"
version = "0.1.0"
description = "Cross-database compact neuro-symbolic NL2SQL engine"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.48.0",
    "datasets>=2.20.0",
    "huggingface_hub>=0.25.0",
    "sqlalchemy>=2.0.30",
    "sqlglot>=25.0.0",
    "rank-bm25>=0.2.2",
    "dateparser>=1.2.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "psutil>=6.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
constrained = ["xgrammar>=0.1.18"]
onnx = ["optimum[onnxruntime]>=1.22.0", "onnxruntime>=1.19.0"]
dev = ["pytest>=8.2.0", "httpx>=0.27.0"]

[project.scripts]
nl2sql-serve = "nl2sql.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
